# MoodMatch — CI/CD: Build → Push to ACR → Deploy to AKS
# Triggered on every push to main.
#
# Required GitHub secrets (OIDC — no long-lived credentials stored):
#   AZURE_CLIENT_ID       — App registration / managed-identity client ID
#   AZURE_TENANT_ID       — Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID — Azure subscription ID
#
# Set up an OIDC federated credential in Azure Entra ID for this repo:
#   Issuer:  https://token.actions.githubusercontent.com
#   Subject: repo:<org>/<repo>:ref:refs/heads/main

name: Build and Deploy MoodMatch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

env:
  REGISTRY: obuksacr.azurecr.io
  IMAGE_NAME: moodmatch
  CLUSTER_NAME: obuks-aks
  RESOURCE_GROUP: t-ogejaife-rg
  NAMESPACE: default

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build & push the Docker image to ACR
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache pip dependencies to speed up repeated builds
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set image tag
        id: meta
        run: echo "sha_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # ──────────────────────────────────────────────
  # Job 2: Deploy to AKS
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          resource-group: ${{ env.RESOURCE_GROUP }}

      - name: Update image tag in manifests
        run: |
          # Patch the deployment image to the exact commit SHA for traceability
          kubectl set image deployment/${{ env.IMAGE_NAME }} \
            ${{ env.IMAGE_NAME }}=${{ needs.build.outputs.image_tag }} \
            --namespace=${{ env.NAMESPACE }} --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Apply Kubernetes manifests
        uses: azure/k8s-deploy@v5
        with:
          namespace: ${{ env.NAMESPACE }}
          manifests: |
            k8s/configmap.yaml
            k8s/secret.yaml
            k8s/deployment.yaml
            k8s/service.yaml
          images: ${{ needs.build.outputs.image_tag }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} \
            --namespace=${{ env.NAMESPACE }} --timeout=180s

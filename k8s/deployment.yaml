apiVersion: apps/v1
kind: Deployment
metadata:
  name: applied-ai-final-project-codepath
  labels:
    app.kubernetes.io/name: applied-ai-final-project-codepath
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: applied-ai-final-project-codepath
  annotations:
    com.azure.containerizationassist/version: "1.4.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: applied-ai-final-project-codepath
  template:
    metadata:
      labels:
        app.kubernetes.io/name: applied-ai-final-project-codepath
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: applied-ai-final-project-codepath
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: obuksacr.azurecr.io/applied-ai-final-project-codepath:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

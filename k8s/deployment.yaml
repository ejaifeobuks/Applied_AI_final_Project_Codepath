apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodmatch
  namespace: default
  labels:
    app: moodmatch
  annotations:
    com.azure.containerizationassist/version: "1.4.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moodmatch
  template:
    metadata:
      labels:
        app: moodmatch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: moodmatch
          image: obuksacr.azurecr.io/moodmatch:latest
          ports:
            - containerPort: 8501
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
